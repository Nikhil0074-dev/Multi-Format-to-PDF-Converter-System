<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Format PDF Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface-2: #1c2030;
      --border: #252a38;
      --border-hover: #3a4158;
      --accent: #4f8ef7;
      --accent-dim: #2a4a8a;
      --accent-glow: rgba(79,142,247,0.15);
      --green: #34d399;
      --green-dim: #064e3b;
      --amber: #fbbf24;
      --red: #f87171;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --radius: 8px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

    /* ---- Layout ---- */
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      font-weight: 700;
    }

    .header-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.offline { background: var(--red); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      padding: 28px 28px 28px 32px;
      border-right: 1px solid var(--border);
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 28px 32px 28px 28px;
      gap: 20px;
    }

    /* ---- Section labels ---- */
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ---- Drop Zone ---- */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--surface);
      position: relative;
      margin-bottom: 24px;
      min-height: 180px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .drop-zone.drag-over { border-style: solid; }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 20px;
    }

    .drop-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .drop-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .drop-formats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .format-tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    /* ---- File List ---- */
    .file-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

    .file-item {
      display: grid;
      grid-template-columns: 36px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s;
    }

    .file-item:hover { border-color: var(--border-hover); }
    .file-item.converting { border-color: var(--accent-dim); }
    .file-item.done { border-color: var(--green-dim); }
    .file-item.error { border-color: #7f1d1d; }

    .file-ext-badge {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .ext-py { background: #1e3a5f; color: #60a5fa; }
    .ext-ipynb { background: #3b2100; color: #fb923c; }
    .ext-c, .ext-cpp { background: #1a3a1a; color: #4ade80; }
    .ext-html, .ext-htm { background: #3a1a00; color: #fb923c; }
    .ext-txt { background: #1e293b; color: #94a3b8; }
    .ext-java { background: #3b0000; color: #fca5a5; }
    .ext-js { background: #332500; color: #fde68a; }
    .ext-css { background: #00213b; color: #7dd3fc; }
    .ext-default { background: var(--surface-2); color: var(--text-muted); }

    .file-info { min-width: 0; }

    .file-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .file-status {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-pending { background: var(--surface-2); color: var(--text-muted); }
    .status-converting { background: var(--accent-dim); color: var(--accent); }
    .status-done { background: var(--green-dim); color: var(--green); }
    .status-error { background: #3b0000; color: var(--red); }

    .file-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 14px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .file-remove:hover { color: var(--red); background: #3b000033; }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      white-space: nowrap;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3b7de8; }

    .btn-outline {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) { border-color: var(--border-hover); color: var(--text); }

    .btn-success { background: var(--green); color: #022c22; }
    .btn-success:hover:not(:disabled) { background: #10b981; }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--border-hover); color: var(--text-dim); }

    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-full { width: 100%; }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    /* ---- Progress Bar ---- */
    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 16px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ---- Watermark Panel ---- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      font-family: var(--mono);
      letter-spacing: 0.05em;
    }

    .panel-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    .field-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 11px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--text-muted); }

    select.field-input { appearance: none; cursor: pointer; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .range-wrap { display: flex; align-items: center; gap: 10px; }
    .range-val {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      min-width: 30px;
      text-align: right;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }

    .toggle {
      position: relative;
      width: 38px;
      height: 21px;
      cursor: pointer;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      transition: background 0.2s, border-color 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform 0.2s, background 0.2s;
    }

    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(17px);
      background: var(--accent);
    }

    /* ---- Results Panel ---- */
    .results-list { display: flex; flex-direction: column; gap: 8px; }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--green-dim);
      border-radius: var(--radius);
    }

    .result-name {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* ---- Toast ---- */
    .toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .toast {
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      animation: slideIn 0.2s ease;
      max-width: 320px;
    }

    .toast-success { background: #022c22; border: 1px solid var(--green); color: var(--green); }
    .toast-error { background: #3b0000; border: 1px solid var(--red); color: var(--red); }
    .toast-info { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); }

    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ---- Empty state ---- */
    .empty-hint {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
  </style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const API = 'http://localhost:5000/api';

// ---- Utilities ----
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function getExtClass(ext) {
  const map = { py:'ext-py', ipynb:'ext-ipynb', c:'ext-c', cpp:'ext-cpp',
    html:'ext-html', htm:'ext-htm', txt:'ext-txt', java:'ext-java',
    js:'ext-js', css:'ext-css' };
  return map[ext] || 'ext-default';
}

// ---- Toast ----
function ToastContainer({ toasts }) {
  return React.createElement('div', { className: 'toast-wrap' },
    toasts.map(t =>
      React.createElement('div', { key: t.id, className: `toast toast-${t.type}` }, t.message)
    )
  );
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((message, type = 'info') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  }, []);
  return { toasts, show };
}

// ---- Toggle ----
function Toggle({ checked, onChange }) {
  return React.createElement('label', { className: 'toggle' },
    React.createElement('input', { type: 'checkbox', checked, onChange }),
    React.createElement('span', { className: 'toggle-track' }),
    React.createElement('span', { className: 'toggle-thumb' })
  );
}

// ---- File Item ----
function FileItem({ file, onRemove }) {
  const statusClass = { pending:'status-pending', converting:'status-converting',
    done:'status-done', error:'status-error' }[file.status] || 'status-pending';
  const statusLabel = { pending:'Pending', converting:'Converting...', done:'Done', error:'Error' }[file.status];

  return React.createElement('div', { className: `file-item ${file.status}` },
    React.createElement('div', { className: `file-ext-badge ${getExtClass(file.extension)}` }, file.extension),
    React.createElement('div', { className: 'file-info' },
      React.createElement('div', { className: 'file-name', title: file.original_name }, file.original_name),
      React.createElement('div', { className: 'file-meta' }, formatSize(file.size))
    ),
    React.createElement('span', { className: `file-status ${statusClass}` }, statusLabel),
    file.status !== 'converting'
      ? React.createElement('button', { className: 'file-remove', onClick: () => onRemove(file.id), title: 'Remove' },
          React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 14 14', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 },
            React.createElement('path', { d: 'M1 1l12 12M13 1L1 13' })
          )
        )
      : React.createElement('div', { className: 'spinner' })
  );
}

// ---- Drop Zone ----
function DropZone({ onFiles }) {
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    setDragging(false);
    const files = Array.from(e.dataTransfer.files);
    if (files.length) onFiles(files);
  }, [onFiles]);

  const handleDragOver = useCallback((e) => {
    e.preventDefault();
    setDragging(true);
  }, []);

  const handleDragLeave = useCallback(() => setDragging(false), []);

  const handleChange = useCallback((e) => {
    const files = Array.from(e.target.files);
    if (files.length) onFiles(files);
    e.target.value = '';
  }, [onFiles]);

  return React.createElement('div', {
    className: `drop-zone${dragging ? ' drag-over' : ''}`,
    onDrop: handleDrop,
    onDragOver: handleDragOver,
    onDragLeave: handleDragLeave,
    onClick: () => inputRef.current && inputRef.current.click(),
  },
    React.createElement('input', {
      ref: inputRef,
      type: 'file',
      multiple: true,
      accept: '.py,.ipynb,.c,.cpp,.h,.html,.htm,.txt,.java,.js,.css',
      onChange: handleChange,
      style: { display: 'none' }
    }),
    React.createElement('div', { className: 'drop-icon' },
      React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
        React.createElement('path', { d: 'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4' }),
        React.createElement('polyline', { points: '17 8 12 3 7 8' }),
        React.createElement('line', { x1: 12, y1: 3, x2: 12, y2: 15 })
      )
    ),
    React.createElement('div', { className: 'drop-title' }, dragging ? 'Release to add files' : 'Drag files here or click to browse'),
    React.createElement('div', { className: 'drop-sub' }, 'Multiple files supported'),
    React.createElement('div', { className: 'drop-formats' },
      ['.py', '.ipynb', '.c', '.cpp', '.html', '.txt', '.java', '.js', '.css'].map(fmt =>
        React.createElement('span', { key: fmt, className: 'format-tag' }, fmt)
      )
    )
  );
}

// ---- Watermark Settings ----
function WatermarkPanel({ config, onChange }) {
  const set = (key, val) => onChange({ ...config, [key]: val });
  return React.createElement('div', { className: 'panel' },
    React.createElement('div', { className: 'panel-header' },
      React.createElement('span', { className: 'panel-title' }, 'WATERMARK'),
      React.createElement(Toggle, { checked: config.enabled, onChange: e => set('enabled', e.target.checked) })
    ),
    config.enabled && React.createElement('div', { className: 'panel-body' },
      React.createElement('div', null,
        React.createElement('div', { className: 'field-label' }, 'Watermark Text'),
        React.createElement('input', {
          className: 'field-input',
          type: 'text',
          value: config.text,
          onChange: e => set('text', e.target.value),
          placeholder: 'e.g. CONFIDENTIAL'
        })
      ),
      React.createElement('div', null,
        React.createElement('div', { className: 'field-label' }, 'Position'),
        React.createElement('select', {
          className: 'field-input',
          value: config.position,
          onChange: e => set('position', e.target.value)
        },
          ['center','top','bottom','top-left','top-right','bottom-left','bottom-right'].map(p =>
            React.createElement('option', { key: p, value: p }, p.charAt(0).toUpperCase() + p.slice(1).replace('-', ' '))
          )
        )
      ),
      React.createElement('div', { className: 'field-row' },
        React.createElement('div', null,
          React.createElement('div', { className: 'field-label' }, 'Opacity'),
          React.createElement('div', { className: 'range-wrap' },
            React.createElement('input', {
              type: 'range', min: 0.05, max: 0.9, step: 0.05,
              value: config.opacity,
              onChange: e => set('opacity', parseFloat(e.target.value))
            }),
            React.createElement('span', { className: 'range-val' }, Math.round(config.opacity * 100) + '%')
          )
        ),
        React.createElement('div', null,
          React.createElement('div', { className: 'field-label' }, 'Font Size'),
          React.createElement('div', { className: 'range-wrap' },
            React.createElement('input', {
              type: 'range', min: 20, max: 96, step: 4,
              value: config.font_size,
              onChange: e => set('font_size', parseInt(e.target.value))
            }),
            React.createElement('span', { className: 'range-val' }, config.font_size)
          )
        )
      )
    )
  );
}

// ---- Results Panel ----
function ResultsPanel({ results, onDownloadSingle, onDownloadAll }) {
  if (!results.length) return null;
  return React.createElement('div', { className: 'panel' },
    React.createElement('div', { className: 'panel-header' },
      React.createElement('span', { className: 'panel-title' }, `RESULTS (${results.length})`),
      results.length > 1 && React.createElement('button', {
        className: 'btn btn-success btn-sm',
        onClick: onDownloadAll
      }, 'Download ZIP')
    ),
    React.createElement('div', { className: 'panel-body', style: { gap: 8 } },
      results.map(r =>
        React.createElement('div', { key: r.output_name, className: 'result-item' },
          React.createElement('span', { className: 'result-name', title: r.output_name },
            r.original_name.replace(/\.[^.]+$/, '') + '.pdf'
          ),
          React.createElement('button', {
            className: 'btn btn-ghost btn-sm',
            onClick: () => onDownloadSingle(r.output_name)
          }, 'PDF')
        )
      )
    )
  );
}

// ---- Main App ----
function App() {
  const [files, setFiles] = useState([]);
  const [serverOnline, setServerOnline] = useState(false);
  const [converting, setConverting] = useState(false);
  const [results, setResults] = useState([]);
  const [watermark, setWatermark] = useState({
    enabled: false,
    text: 'CONFIDENTIAL',
    position: 'center',
    opacity: 0.3,
    font_size: 48,
  });
  const { toasts, show: showToast } = useToast();

  // Health check on mount
  useEffect(() => {
    fetch(`${API}/health`)
      .then(r => r.ok ? setServerOnline(true) : setServerOnline(false))
      .catch(() => setServerOnline(false));
  }, []);

  const handleFiles = useCallback(async (rawFiles) => {
    if (!serverOnline) {
      showToast('Server is offline. Start the Flask backend first.', 'error');
      return;
    }

    const formData = new FormData();
    rawFiles.forEach(f => formData.append('files', f));

    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
      const data = await res.json();

      if (data.uploaded && data.uploaded.length > 0) {
        const newFiles = data.uploaded.map(f => ({ ...f, status: 'pending' }));
        setFiles(prev => [...prev, ...newFiles]);
        showToast(`${data.uploaded.length} file(s) added`, 'success');
      }

      if (data.errors && data.errors.length > 0) {
        data.errors.forEach(e => showToast(`${e.filename}: ${e.error}`, 'error'));
      }
    } catch (err) {
      showToast('Upload failed. Is the server running?', 'error');
    }
  }, [serverOnline, showToast]);

  const handleRemove = useCallback((id) => {
    setFiles(prev => prev.filter(f => f.id !== id));
  }, []);

  const handleConvert = useCallback(async () => {
    const pending = files.filter(f => f.status === 'pending');
    if (!pending.length) { showToast('No files pending conversion', 'info'); return; }
    if (!serverOnline) { showToast('Server is offline', 'error'); return; }

    setConverting(true);
    setFiles(prev => prev.map(f => f.status === 'pending' ? { ...f, status: 'converting' } : f));

    try {
      const res = await fetch(`${API}/convert`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: pending, watermark })
      });
      const data = await res.json();

      // Update statuses
      const doneIds = new Set((data.results || []).map(r => r.original_name));
      const errorMap = {};
      (data.errors || []).forEach(e => { errorMap[e.filename] = true; });

      setFiles(prev => prev.map(f => {
        if (doneIds.has(f.original_name)) return { ...f, status: 'done' };
        if (errorMap[f.original_name]) return { ...f, status: 'error' };
        return f;
      }));

      if (data.results && data.results.length > 0) {
        setResults(prev => [...prev, ...data.results]);
        showToast(`${data.results.length} file(s) converted successfully`, 'success');
      }

      if (data.errors && data.errors.length > 0) {
        data.errors.forEach(e => showToast(`Failed: ${e.filename} - ${e.error}`, 'error'));
      }
    } catch (err) {
      showToast('Conversion failed. Check server logs.', 'error');
      setFiles(prev => prev.map(f => f.status === 'converting' ? { ...f, status: 'error' } : f));
    } finally {
      setConverting(false);
    }
  }, [files, watermark, serverOnline, showToast]);

  const handleDownloadSingle = useCallback((outputName) => {
    window.open(`${API}/download/${encodeURIComponent(outputName)}`, '_blank');
  }, []);

  const handleDownloadAll = useCallback(async () => {
    if (!results.length) return;
    try {
      const res = await fetch(`${API}/download-zip`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: results.map(r => r.output_name) })
      });
      if (!res.ok) { showToast('ZIP creation failed', 'error'); return; }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted_files.zip';
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showToast('Download failed', 'error');
    }
  }, [results, showToast]);

  const handleClearAll = useCallback(() => {
    setFiles([]);
    setResults([]);
    showToast('Cleared', 'info');
  }, [showToast]);

  const pendingCount = files.filter(f => f.status === 'pending').length;
  const doneCount = files.filter(f => f.status === 'done').length;
  const totalFiles = files.length;
  const progressPct = totalFiles > 0 ? Math.round((doneCount / totalFiles) * 100) : 0;

  return React.createElement('div', { className: 'app' },
    // Header
    React.createElement('header', null,
      React.createElement('div', { className: 'logo' },
        React.createElement('div', { className: 'logo-icon' }, 'PDF'),
        'Multi-Format Converter'
      ),
      React.createElement('div', { className: 'header-status' },
        React.createElement('span', { className: `status-dot${serverOnline ? '' : ' offline'}` }),
        serverOnline ? 'Server Online' : 'Server Offline',
        totalFiles > 0 && React.createElement('span', { style: { marginLeft: 12, color: 'var(--text-dim)' } },
          `${doneCount}/${totalFiles} converted`
        )
      )
    ),

    // Main
    React.createElement('main', null,
      // Left Panel
      React.createElement('div', { className: 'left-panel' },
        React.createElement('div', { className: 'section-label' }, 'Upload Files'),
        React.createElement(DropZone, { onFiles: handleFiles }),

        files.length > 0 && React.createElement(React.Fragment, null,
          React.createElement('div', { className: 'section-label' }, `Queue (${files.length})`),
          React.createElement('div', { className: 'file-list' },
            files.map(f => React.createElement(FileItem, { key: f.id, file: f, onRemove: handleRemove }))
          ),

          doneCount > 0 && totalFiles > 0 && React.createElement('div', { className: 'progress-bar-wrap' },
            React.createElement('div', { className: 'progress-bar-fill', style: { width: progressPct + '%' } })
          ),

          React.createElement('div', { className: 'action-row' },
            React.createElement('button', {
              className: 'btn btn-primary btn-full',
              onClick: handleConvert,
              disabled: converting || pendingCount === 0
            },
              converting
                ? React.createElement(React.Fragment, null,
                    React.createElement('div', { className: 'spinner' }),
                    'Converting...'
                  )
                : `Convert ${pendingCount > 0 ? pendingCount + ' File' + (pendingCount > 1 ? 's' : '') : 'Files'}`
            ),
            React.createElement('button', {
              className: 'btn btn-outline',
              onClick: handleClearAll,
              disabled: converting
            }, 'Clear All')
          )
        )
      ),

      // Right Panel
      React.createElement('div', { className: 'right-panel' },
        React.createElement(WatermarkPanel, { config: watermark, onChange: setWatermark }),
        React.createElement(ResultsPanel, {
          results,
          onDownloadSingle: handleDownloadSingle,
          onDownloadAll: handleDownloadAll
        }),
        results.length === 0 && React.createElement('div', { className: 'empty-hint' },
          'Converted PDFs will appear here'
        )
      )
    ),

    React.createElement(ToastContainer, { toasts })
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
